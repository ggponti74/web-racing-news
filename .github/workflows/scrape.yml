name: Hourly Script

on:
  schedule:
    - cron: '15 */4 * * *' # every 4 hours hour at minute 15
  workflow_dispatch:        # allows manual trigger too

concurrency:
  group: scrape-workflow
  cancel-in-progress: false

# Grant permissions for the entire workflow
permissions:
  contents: write    # Required to push code, create releases, etc.
  issues: write      # Required to open/close issues
  pull-requests: write
  actions: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape F1 News
        run: node ./scripts/scrape-f1-news.mjs
      - name: Scrape F1 Schedule
        run: node ./scripts/scrape-f1-next-race.mjs
      - name: Scrape F2 News
        run: node ./scripts/scrape-f2-news.mjs
      - name: Scrape F2 Schedule
        run: node ./scripts/scrape-f2-next-race.mjs
      - name: Scrape F2 Drivers
        run: node ./scripts/scrape-f2-drivers.mjs
      - name: Scrape F2 Teams
        run: node ./scripts/scrape-f2-teams.mjs
      - name: Scrape F3 News
        run: node ./scripts/scrape-f3-news.mjs
      - name: Scrape F3 Schedule
        run: node ./scripts/scrape-f3-next-race.mjs
      - name: Scrape F3 Drivers
        run: node ./scripts/scrape-f3-drivers.mjs
      - name: Scrape F3 Teams
        run: node ./scripts/scrape-f3-teams.mjs
      - name: Scrape IndyCar News
        run: node ./scripts/scrape-indycar-news.mjs
      - name: Scrape IndyCar Schedule
        run: node ./scripts/scrape-indycar-next-race.mjs
      - name: Scrape IndyCar Drivers
        run: node ./scripts/scrape-indycar-drivers.mjs
      - name: Scrape IndyCar Manufacturers
        run: node ./scripts/scrape-indycar-manufacturers.mjs
      - name: Scrape FE News
        run: node ./scripts/scrape-fe-news.mjs
      - name: Scrape FE Schedule
        run: node ./scripts/scrape-fe-next-race.mjs
      - name: Scrape FE Drivers
        run: node ./scripts/scrape-fe-drivers.mjs
      - name: Scrape FE Teams
        run: node ./scripts/scrape-fe-teams.mjs
      - name: Fetch next race maps
        env:
            MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: node ./scripts/fetch-race-maps.mjs
      - name: Stamp last-updated time
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s|^const __UPDATE_TIMESTAMP__ = \".*\";|const __UPDATE_TIMESTAMP__ = \"$NOW\";|" src/components/LastUpdated.jsx
      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "ggponti74"
          git config user.email "ggponti74@hotmail.com"
          git add public/data/*.json
          git add public/data/*.json src/components/LastUpdated.jsx
          git add public/images/maps/*.jpg
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update scraped data [automated]"
            git pull --rebase -X ours origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
